# ConfigMap — не-секретные переменные окружения.
# Секреты (DB_PASSWORD, APP_KEY, API_KEY) хранятся в Secret, не здесь.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payment-gateway.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "payment-gateway.labels" . | nindent 4 }}
data:
  # Laravel config
  APP_ENV:   {{ .Values.config.APP_ENV | quote }}
  APP_DEBUG: {{ .Values.config.APP_DEBUG | quote }}
  APP_URL:   {{ printf "https://%s" .Values.ingress.host | quote }}

  # Logging
  LOG_CHANNEL: {{ .Values.config.LOG_CHANNEL | quote }}
  LOG_LEVEL:   {{ .Values.config.LOG_LEVEL | quote }}

  # Database
  DB_CONNECTION: pgsql
  DB_HOST:       {{ include "payment-gateway.dbHost" . | quote }}
  DB_PORT:       {{ .Values.externalDatabase.port | default 5432 | quote }}
  DB_DATABASE:   {{ .Values.externalDatabase.database | default .Values.postgresql.auth.database | quote }}
  DB_USERNAME:   {{ .Values.externalDatabase.username | default .Values.postgresql.auth.username | quote }}

  # Redis
  REDIS_HOST: {{ include "payment-gateway.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.externalRedis.port | default 6379 | quote }}

  # Queue / Cache / Session
  QUEUE_CONNECTION:    {{ .Values.config.QUEUE_CONNECTION | quote }}
  CACHE_DRIVER:        {{ .Values.config.CACHE_DRIVER | quote }}
  SESSION_DRIVER:      {{ .Values.config.SESSION_DRIVER | quote }}
  BROADCAST_CONNECTION: {{ .Values.config.BROADCAST_CONNECTION | quote }}

  # Nginx config — монтируется в nginx sidecar
  nginx.conf: |
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;

    server {
        listen 80;
        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        error_page 429 @rate_limit_json;
        location @rate_limit_json {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":"rate_limit_exceeded","message":"Too Many Requests"}';
        }

        location /api/webhook/ {
            limit_req zone=webhooks burst=10 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location /api/health  { try_files $uri $uri/ /index.php?$query_string; }
        location /api/metrics { try_files $uri $uri/ /index.php?$query_string; }
        location / { try_files $uri $uri/ /index.php?$query_string; }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            # В k8s php-fpm и nginx — два контейнера в одном Pod'е (sidecar).
            # Они общаются через localhost, т.к. у Pod'а одна сетевая карта.
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* { deny all; }
    }
