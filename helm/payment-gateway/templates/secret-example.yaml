# ВНИМАНИЕ: Этот файл — только пример структуры Secret.
# НЕ коммить реальные секреты в git!
#
# Создай Secret вручную:
#
#   kubectl create secret generic payment-gateway-app \
#     --namespace payment-gateway-staging \
#     --from-literal=APP_KEY='base64:...' \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=API_KEY='...' \
#     --from-literal=YOOKASSA_SHOP_ID='...' \
#     --from-literal=YOOKASSA_SECRET_KEY='...' \
#     --from-literal=SENTRY_DSN='https://...'
#
# Или используй External Secrets Operator (ESO) для синхронизации из
# AWS Secrets Manager / HashiCorp Vault / Azure Key Vault:
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: payment-gateway-app
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#   target:
#     name: payment-gateway-app
#   data:
#     - secretKey: APP_KEY
#       remoteRef:
#         key: payment-gateway/app-key
#     - secretKey: DB_PASSWORD
#       remoteRef:
#         key: payment-gateway/db-password
