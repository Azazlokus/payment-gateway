# Deployment для PHP-FPM + Nginx (sidecar паттерн).
#
# Почему два контейнера в одном Pod'е?
# PHP-FPM — application сервер, слушает :9000 (FastCGI, не HTTP).
# Nginx — HTTP сервер, принимает :80 и проксирует на PHP-FPM через FastCGI.
# Вместе они образуют полноценный web сервер.
# В одном Pod'е они общаются через localhost — быстро и без network overhead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-gateway.fullname" . }}-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "payment-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # HPA управляет replicas когда autoscaling.enabled = true
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.app }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "payment-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # можно временно поднять на 1 pod выше replicas
      maxUnavailable: 0  # ни один pod не падает до появления нового (zero-downtime)

  template:
    metadata:
      labels:
        {{- include "payment-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # Заставляет pod перезапуститься при изменении ConfigMap/Secret
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      serviceAccountName: {{ include "payment-gateway.serviceAccountName" . }}

      # Anti-affinity: не ставить два pod'а на один Node.
      # Если Node упадёт — другие реплики выживут.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "payment-gateway.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: app
                topologyKey: kubernetes.io/hostname

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # initContainer запускается ДО основных контейнеров.
      # Выполняет миграции — только один раз при деплое.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
          envFrom:
            - configMapRef:
                name: {{ include "payment-gateway.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      containers:
        # ── PHP-FPM ───────────────────────────────────────────────────────────
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "payment-gateway.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}

          # Liveness — если /api/health не отвечает 3 раза подряд, pod перезапускается
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 80        # nginx sidecar слушает 80, он проксирует на fpm
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          # Readiness — пока не готов, трафик не идёт (напр. во время миграции)
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 80
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}

          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001      # appuser из Dockerfile
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Laravel пишет в storage/

        # ── Nginx sidecar ─────────────────────────────────────────────────────
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: public
              mountPath: /var/www/html/public
              readOnly: true

          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            runAsNonRoot: false   # nginx требует root для binding port 80
            allowPrivilegeEscalation: false

      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "payment-gateway.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}

        - name: nginx-config
          configMap:
            name: {{ include "payment-gateway.fullname" . }}-config
            items:
              - key: nginx.conf
                path: default.conf

        # Статические файлы — копируем из app контейнера в init
        - name: public
          emptyDir: {}
