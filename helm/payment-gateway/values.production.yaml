# =============================================================================
# values.production.yaml — переопределения для production
# Запуск: helm upgrade --install ... -f values.yaml -f values.production.yaml
# =============================================================================

image:
  tag: ""   # задаётся в CI: --set image.tag=${{ github.sha }}

replicaCount:
  app:     3
  horizon: 2

ingress:
  host: pay.yourdomain.com
  tls:
    enabled: true
    secretName: payment-gateway-tls-prod

config:
  APP_ENV: production
  LOG_LEVEL: error

autoscaling:
  minReplicas: 3
  maxReplicas: 20

# В prod используем внешний managed PostgreSQL (RDS / Cloud SQL)
postgresql:
  enabled: false

externalDatabase:
  host: your-rds-endpoint.amazonaws.com
  port: 5432
  database: payment_gateway
  username: postgres

# В prod используем внешний managed Redis (ElastiCache)
redis:
  enabled: false

externalRedis:
  host: your-elasticache-endpoint.amazonaws.com
  port: 6379
