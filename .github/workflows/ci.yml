name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 1. Code style ──────────────────────────────────────────────────────────
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Check code style
        run: ./vendor/bin/pint --test

  # ─── 2. Frontend build (Vue + Vite) ─────────────────────────────────────────
  frontend:
    name: Frontend Build (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build assets
        run: npm run build

  # ─── 3. Static analysis (Larastan) ──────────────────────────────────────────
  analyse:
    name: Static Analysis (Larastan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate --force

      - name: Run Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ─── 4. Architecture (Deptrac) ───────────────────────────────────────────────
  architecture:
    name: Architecture (Deptrac)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Check architecture rules
        run: php vendor/bin/deptrac analyse --no-progress

  # ─── 5. Rector (dry-run) ────────────────────────────────────────────────────
  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Rector dry-run
        run: php vendor/bin/rector process --dry-run --no-progress-bar

  # ─── 6. Unit tests (no services) ──────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Run unit tests
        run: php vendor/bin/phpunit --testsuite=Unit --colors=always

  # ─── 7. Feature tests (SQLite in-memory + Redis) ────────────────────────────
  test-feature:
    name: Feature Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run migrations (SQLite)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run feature tests
        run: php vendor/bin/phpunit --testsuite=Feature --colors=always
        env:
          REDIS_HOST: 127.0.0.1

  # ─── 8. Mutation testing (Infection PHP) ────────────────────────────────────
  mutation:
    name: Mutation Tests (Infection)
    runs-on: ubuntu-latest
    needs: [test-unit]          # запускаем только если unit прошли
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov        # Infection требует coverage

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Infection
        run: php vendor/bin/infection --threads=4 --min-msi=70 --min-covered-msi=80 --no-progress
        env:
          INFECTION_BADGE_API_KEY: ${{ secrets.INFECTION_BADGE_API_KEY }}

  # ─── 9. TypeScript SDK typecheck ────────────────────────────────────────────
  sdk-typecheck:
    name: TypeScript SDK (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript
        run: npm install

      - name: Type-check SDK
        run: npx tsc --noEmit

  # ─── 10. E2E tests (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-feature]       # запускаем после feature-тестов
    defaults:
      run:
        working-directory: e2e

    services:
      app:
        image: ghcr.io/${{ github.repository }}:latest
        env:
          APP_ENV: testing
          APP_KEY: base64:testkey000000000000000000000000=
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/test.db
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
        ports:
          - 8000:80
        options: >-
          --health-cmd "wget -qO- http://localhost/api/health || exit 1"
          --health-interval 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm test
        env:
          BASE_URL: http://localhost:8000
          API_KEY:  ${{ secrets.E2E_API_KEY }}
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ─── 11. All checks passed (branch protection gate) ─────────────────────────
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, frontend, analyse, architecture, rector, test-unit, test-feature, sdk-typecheck]
    steps:
      - run: echo "All required checks passed"
