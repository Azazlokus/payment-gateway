# =============================================================================
# docker-compose.yml — BASE skeleton
#
# Defines service shapes: what runs, how it's built, what it needs.
# Does NOT contain environment-specific settings (ports, restart, resource limits).
#
# Run with an environment overlay:
#   Local dev  : docker compose up                                          (auto-applies override.yml)
#   Production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Staging    : docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   CI         : docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# Or use Makefile shortcuts: make up / make prod-up / make staging-up / make ci-up
# =============================================================================

services:

  # ─── PHP-FPM application ──────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: payment-gateway-app
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment-network

  # ─── Nginx web server ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: payment-gateway-nginx
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - payment-network

  # ─── Vue 3 SPA (optional profile) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payment-gateway-frontend
    depends_on:
      - nginx
    networks:
      - payment-network
    profiles:
      - frontend

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: payment-gateway-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-payment_gateway}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-payment_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-network

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: payment-gateway-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-network

  # ─── Laravel Horizon (queue worker) ───────────────────────────────────────
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod-worker
    container_name: payment-gateway-horizon
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment-network

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: payment-gateway-prometheus
    volumes:
      - ./.docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - nginx
    networks:
      - payment-network

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: payment-gateway-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./.docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - payment-network

  # ─── ELK stack (optional — start with: --profile elk) ────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: payment-gateway-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - payment-network
    profiles:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: payment-gateway-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./.docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./.docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - payment-network
    profiles:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: payment-gateway-kibana
    volumes:
      - ./.docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - payment-network
    profiles:
      - elk

# ─── Volumes ────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
  redis-data:
  app-storage:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  kibana-data:

# ─── Networks ───────────────────────────────────────────────────────────────

networks:
  payment-network:
    driver: bridge
