# =============================================================================
# docker-compose.monitoring.yml — MONITORING STACK
#
# Поднимает полный стек мониторинга поверх любого окружения.
# Prometheus + Grafana всегда включены в base skeleton,
# этот файл добавляет ELK (Elasticsearch + Logstash + Kibana).
#
# Usage:
#   # Локально: dev + мониторинг
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
#   # Продакшн + мониторинг
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
#   make monitoring-up
#   make prod-monitoring-up
# =============================================================================

services:

  elasticsearch:
    restart: unless-stopped
    environment:
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    profiles: []                             # снимаем профиль elk — сервис всегда активен

  logstash:
    restart: unless-stopped
    environment:
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "${LOGSTASH_PORT:-5044}:5044"
    profiles: []

  kibana:
    restart: unless-stopped
    environment:
      - ELASTIC_USER=${ELASTIC_USER:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    profiles: []

  prometheus:
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    restart: unless-stopped
    ports:
      - "3000:3000"
