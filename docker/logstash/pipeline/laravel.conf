input {
  tcp {
    port  => 5044
    codec => json_lines
  }
}

filter {
  # Normalise log level to lowercase string
  if [level_name] {
    mutate { lowercase => ["level_name"] }
  }

  # Parse nested context fields into top-level fields for Kibana
  if [context] {
    ruby {
      code => '
        ctx = event.get("context")
        if ctx.is_a?(Hash)
          ctx.each { |k, v| event.set(k, v) }
          event.remove("context")
        end
      '
    }
  }

  # Drop health-check noise
  if [message] =~ /health/ {
    drop {}
  }

  date {
    match => ["datetime", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
    remove_field => ["datetime"]
  }
}

output {
  elasticsearch {
    hosts     => ["http://elasticsearch:9200"]
    index     => "laravel-payments-%{+YYYY.MM.dd}"
    user      => "${ELASTIC_USER:elastic}"
    password  => "${ELASTIC_PASSWORD:changeme}"
  }

  # Uncomment to also print to stdout during debugging:
  # stdout { codec => rubydebug }
}
