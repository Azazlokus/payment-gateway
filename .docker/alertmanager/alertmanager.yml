global:
  resolve_timeout: 5m
  # Slack webhook — задаётся через переменную окружения SLACK_WEBHOOK_URL
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Маршрутизация алертов
route:
  group_by: ['alertname', 'severity']
  group_wait:      30s   # ждём 30с перед первой отправкой группы
  group_interval:  5m    # новые алерты в той же группе добавляются через 5м
  repeat_interval: 4h    # повторная отправка если алерт не разрешился
  receiver: 'slack-default'

  routes:
    # Критические — отдельный канал, без задержки
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: 'slack-default'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        footer: 'Payment Gateway | {{ .CommonLabels.severity }}'

  - name: 'slack-critical'
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
        footer: 'Payment Gateway'

inhibit_rules:
  # Если сервис полностью упал — не шлём алерты про конверсию и активность
  - source_match:
      alertname: PaymentGatewayDown
    target_match_re:
      alertname: 'LowConversionRate|NoPaymentsCreated'
    equal: ['job']
