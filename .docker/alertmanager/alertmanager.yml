global:
  resolve_timeout: 5m
  # SMTP — в dev используется Mailpit (docker-compose.override.yml)
  # В prod замени на реальный SMTP через переменные окружения:
  #   ALERTMANAGER_SMTP_HOST, ALERTMANAGER_SMTP_FROM, ALERTMANAGER_SMTP_TO
  smtp_smarthost: '${ALERTMANAGER_SMTP_HOST:-mailpit:1025}'
  smtp_from: '${ALERTMANAGER_SMTP_FROM:-alertmanager@payment-gateway.local}'
  smtp_require_tls: false

# Маршрутизация алертов
route:
  group_by: ['alertname', 'severity']
  group_wait:      30s   # ждём 30с перед первой отправкой группы
  group_interval:  5m    # новые алерты в той же группе — через 5м
  repeat_interval: 4h    # повтор если алерт не разрешился
  receiver: 'email-default'

  routes:
    # Критические — без задержки, повтор каждый час, дублируем в Telegram
    - match:
        severity: critical
      receiver: 'email-and-telegram-critical'
      group_wait: 0s
      repeat_interval: 1h

    # Warning — только Telegram (быстрее чем email)
    - match:
        severity: warning
      receiver: 'telegram-default'

receivers:
  - name: 'email-default'
    email_configs:
      - to: '${ALERTMANAGER_SMTP_TO:-ops@payment-gateway.local}'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}][{{ .CommonLabels.severity }}] {{ .GroupLabels.alertname }}'
        html: |
          <h3>{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .GroupLabels.alertname }}</h3>
          {{ range .Alerts }}
          <p><strong>{{ .Annotations.summary }}</strong><br>
          {{ .Annotations.description }}</p>
          <hr>
          {{ end }}

  - name: 'email-and-telegram-critical'
    email_configs:
      - to: '${ALERTMANAGER_SMTP_TO:-ops@payment-gateway.local}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }} — ТРЕБУЕТ НЕМЕДЛЕННОГО ВНИМАНИЯ'
        html: |
          <h2 style="color:red">CRITICAL ALERT: {{ .GroupLabels.alertname }}</h2>
          {{ range .Alerts }}
          <p><strong>{{ .Annotations.summary }}</strong><br>
          {{ .Annotations.description }}</p>
          <hr>
          {{ end }}
    webhook_configs:
      # Telegram Bot — настрой TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в .env
      # Используем webhook-адаптер https://github.com/metalmatze/alertmanager-bot
      # или самописный скрипт. Пример с curl:
      #   docker run -e TOKEN=$TOKEN -e CHAT=$CHAT metalmatze/alertmanager-bot
      - url: '${TELEGRAM_WEBHOOK_URL:-http://localhost:9119/alert}'
        send_resolved: true

  # Только Telegram для warning-алертов
  - name: 'telegram-default'
    webhook_configs:
      - url: '${TELEGRAM_WEBHOOK_URL:-http://localhost:9119/alert}'
        send_resolved: true

inhibit_rules:
  # Если сервис полностью упал — не шлём алерты про конверсию и активность
  - source_match:
      alertname: PaymentGatewayDown
    target_match_re:
      alertname: 'LowConversionRate|NoPaymentsCreated'
    equal: ['job']
