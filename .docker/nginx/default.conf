# Rate limiting zones (defined at http level — placed here via include)
# webhooks: провайдеры шлют редко, но важен burst для всплесков
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/m;
# api: клиентский трафик — 60 req/min с burst 20
limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Вебхуки провайдеров — отдельная зона, мягкий burst
    location /api/webhook/ {
        limit_req zone=webhooks burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Бизнес API v1 — 60 req/min, burst 20
    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Инфраструктурные эндпоинты — без rate limit (health/metrics/horizon)
    location /api/health  { try_files $uri $uri/ /index.php?$query_string; }
    location /api/metrics { try_files $uri $uri/ /index.php?$query_string; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
