groups:
  - name: payment_gateway
    interval: 30s
    rules:

      # ─── Сервис ────────────────────────────────────────────────────────────

      - alert: PaymentGatewayDown
        expr: up{job="payment-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Payment Gateway недоступен"
          description: "Prometheus не может собрать метрики с /api/metrics уже {{ $value | humanizeDuration }}."

      # ─── DLQ ───────────────────────────────────────────────────────────────

      - alert: HighFailedJobs
        expr: failed_jobs_count > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Много упавших задач в DLQ"
          description: "В очереди failed_jobs накопилось {{ $value }} задач. Запусти: make queue-retry-all"

      - alert: FailedJobsGrowing
        expr: delta(failed_jobs_count[10m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DLQ растёт"
          description: "За 10 минут добавилось {{ $value }} упавших задач."

      # ─── Вебхуки ───────────────────────────────────────────────────────────

      - alert: WebhookFailureSpike
        expr: sum(rate(webhooks_failed_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск ошибок вебхуков"
          description: "Провайдеры: {{ range query \"sum by(provider) (rate(webhooks_failed_total[5m])) > 0\" }}{{ .Labels.provider }} ({{ .Value | humanize }}/s) {{ end }}"

      # ─── Конверсия ─────────────────────────────────────────────────────────

      - alert: LowConversionRate
        expr: |
          sum(rate(payments_succeeded_total[1h])) /
          sum(rate(payments_created_total[1h])) < 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Низкая конверсия платежей"
          description: "Конверсия за последний час: {{ $value | humanizePercentage }}. Норма > 50%."

      # ─── Активность ────────────────────────────────────────────────────────

      - alert: NoPaymentsCreated
        expr: sum(rate(payments_created_total[15m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Нет новых платежей 30 минут"
          description: "Возможно проблема с API или клиентами перестали присылать запросы."

      # ─── Диспуты ───────────────────────────────────────────────────────────

      - alert: DisputeSpike
        expr: sum(rate(disputes_filed_total[1h])) * 3600 > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск диспутов"
          description: "За последний час подано {{ $value | humanize }} диспутов."

      # ─── Возвраты ──────────────────────────────────────────────────────────

      - alert: HighRefundRate
        expr: |
          sum(rate(payments_refunded_total[1h])) /
          clamp_min(sum(rate(payments_succeeded_total[1h])), 0.001) > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокий процент возвратов"
          description: "Доля возвратов от успешных платежей: {{ $value | humanizePercentage }}. Норма < 15%."

      # ─── SLA обработки ─────────────────────────────────────────────────────

      - alert: StalePaymentsPending
        expr: |
          sum(payments_pending_count) > 50
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Много платежей зависло в Pending"
          description: "{{ $value }} платежей в статусе Pending более 20 минут. Запусти: make reconcile"

      # ─── Outbound уведомления ──────────────────────────────────────────────

      - alert: OutboundWebhookHighFailureRate
        expr: |
          sum(rate(outbound_webhooks_failed_total[10m])) /
          clamp_min(sum(rate(outbound_webhooks_sent_total[10m])), 0.001) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "30%+ исходящих уведомлений не доставляются"
          description: "Клиентские эндпоинты не отвечают. Проверь /webhook-logs в UI."
